# Build Windows agent MSI with WiX and publish to a GitHub Release (agent line only).
# Triggers: tag agent-v* (preferred), transitional v* (= agent), or workflow_dispatch.
# Never triggered by server-v*; never reads root/server VERSION (panel line).
#
# Agent semver resolve (order; #79 + MSI Lead):
#   1) inputs.version (strip agent-v / v)
#   2) git tag agent-vX.Y.Z or transitional vX.Y.Z
#   3) agent/VERSION (Agent Lead) else BadAgent.csproj Version
# MSI ProductVersion is always 1.0.0. The archive is bad-agent-<major.minor.patch>.arc.
#
# Required permissions: contents: write (create/update Release + upload assets).
# Secrets: GITHUB_TOKEN is sufficient for a public repo.
# Optional Authenticode (owner cert — do not invent a fake cert):
#   CODE_SIGN_PFX_BASE64, CODE_SIGN_PFX_PASSWORD, optional CODE_SIGN_TIMESTAMP_URL
#   If CODE_SIGN_PFX_BASE64 is empty, MSI ships unsigned (build still succeeds).
#   Panel path does NOT require Authenticode.
#
# Panel / on-prem server (optional, not server self-update):
#   POST …/actions/workflows/release-msi.yml/dispatches
#     ref    = git branch of sources; inputs.version = **agent** semver (not server VERSION)
#     inputs.publish_release  = "true" → GitHub Release on agent-v<semver>
#                             = "false" → only Actions artifact → ingest_uploaded_msi
#   Artifact: bad-agent-msi-<agent-semver> (msi + agent-release.json)
#   Job outputs: version, msi_name, artifact_name, tag
#   Never mix with /var/lib/bad/server-releases/.
#
# Bootstrap notes (WiX v5 via .NET tool):
#   - Runs on windows-latest
#   - `dotnet tool install --global wix --version 5.0.2`
#   - `wix extension add --global WixToolset.Util.wixext/5.0.2`
#   - MSI contains installer/link/bADagent.exe. The publish directory is packed as .arc.

name: release-msi

on:
  push:
    tags:
      - "agent-v*"
      - "v*" # transitional = agent only; do not tag server bumps as v*
  workflow_dispatch:
    inputs:
      version:
        description: "Agent semver (e.g. 1.0.1 or agent-v1.0.1). Empty → agent/VERSION or csproj. Never server VERSION."
        required: false
        type: string
      publish_release:
        description: "Create or update GitHub Release? (panel ingest-only: false)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.ver.outputs.version }}
      msi_name: ${{ steps.ver.outputs.msi_name }}
      artifact_name: bad-agent-msi-${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        run: |
          # Agent line only. Do NOT read root VERSION or server/VERSION.
          $input = "${{ github.event.inputs.version }}".Trim()
          $releaseTag = $null
          if ($input) {
            if ($input -match '^(?i)server-v') {
              throw "server-v* is the server line — not an agent MSI version: $input"
            }
            $version = $input -replace '^(?i)(agent-)?v', ''
            $releaseTag = "agent-v$version"
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $name = $env:GITHUB_REF_NAME
            if ($name -match '^(?i)server-v') {
              throw "Tag $name is server line — release-msi must not run for server-v*"
            }
            if ($name -notmatch '^(?:agent-)?v(.+)$') {
              throw "Tag must be agent-vX.Y.Z or transitional vX.Y.Z, got: $name"
            }
            # Канон: agent-vX.Y.Z; переходный alias vX.Y.Z. Не читать корневой/server VERSION.
            $version = $Matches[1]
            $releaseTag = $name
          } elseif (Test-Path agent/VERSION) {
            $version = (Get-Content agent/VERSION -Raw).Trim()
            $releaseTag = "agent-v$version"
          } else {
            [xml]$csproj = Get-Content agent/src/BadAgent/BadAgent.csproj
            $version = @($csproj.Project.PropertyGroup.Version) |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
              Select-Object -First 1
            if (-not $version) { $version = "1.0.1" }
            $releaseTag = "agent-v$version"
          }
          if ($version -notmatch '^(?<core>\d+\.\d+\.\d+)(?<pre>[-+][0-9A-Za-z.-]+)?$') {
            throw "Agent version must look like major.minor.patch, got: $version"
          }
          $productVersion = $Matches.core
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "product_version=$productVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_name=bad-agent-$productVersion.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=bad-agent-$productVersion.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved agent version=$version release_tag=$releaseTag"

      - name: Build link service
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual C++ tools not found" }
          $bat = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$bat`" && cl /nologo /O2 /W3 /utf-8 /DUNICODE /D_UNICODE /Fe:installer\link\bADagent.exe installer\link\bADagent.c /link /SUBSYSTEM:WINDOWS && cl /nologo /O2 /W3 /utf-8 /DUNICODE /D_UNICODE /Fe:installer\link\bad.exe installer\link\bad.c /link /SUBSYSTEM:CONSOLE"
          if ($LASTEXITCODE -ne 0) { throw "cl failed: $LASTEXITCODE" }

      - name: Publish agent (win-x64 self-contained)
        run: |
          $out = "installer/msi/publish"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          dotnet publish agent/src/BadAgent/BadAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.ver.outputs.product_version }} `
            -o $out
          $zip = Join-Path (Get-Location) "installer/msi/${{ steps.ver.outputs.zip_name }}"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $out).Path, $zip)

      - name: Install WiX toolset (dotnet tool)
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          # --global: cwd-local add caches under repo root; Build MSI runs in installer/msi (WIX0144)
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add --global failed: $LASTEXITCODE" }
          wix extension list --global

      - name: Build MSI
        working-directory: installer/msi
        run: |
          $msi = "${{ steps.ver.outputs.msi_name }}"
          wix build Product.wxs LinkUi.wxs `
            -ext WixToolset.Util.wixext `
            -arch x64 `
            -d ProductVersion=1.0.0 `
            -o $msi
          if (-not (Test-Path $msi)) { throw "MSI not produced: $msi" }

      - name: Sign MSI (Authenticode, optional)
        working-directory: installer/msi
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          $msi = "${{ steps.ver.outputs.msi_name }}"
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64)) {
            Write-Host "CODE_SIGN_PFX_BASE64 not set — shipping unsigned MSI (owner cert required for Authenticode)."
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bad-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim()))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found under Windows Kits" }
            $ts = if ($env:CODE_SIGN_TIMESTAMP_URL) { $env:CODE_SIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
            & $signtool sign /fd SHA256 /td SHA256 /tr $ts /f $pfx /p $env:CODE_SIGN_PFX_PASSWORD $msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit $LASTEXITCODE" }
            & $signtool verify /pa $msi
            Write-Host "MSI signed successfully"
          }
          finally {
            if (Test-Path $pfx) { Remove-Item -Force $pfx -ErrorAction SilentlyContinue }
          }

      - name: Write agent-release.json + SHA256
        working-directory: installer/msi
        run: |
          $zip = "${{ steps.ver.outputs.zip_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version  = "${{ steps.ver.outputs.product_version }}"
            msi_name = $zip
            sha256   = $hash
          }
          $manifest | ConvertTo-Json -Compress | Set-Content -Path agent-release.json -Encoding utf8
          Write-Host "sha256=$hash"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bad-agent-msi-${{ steps.ver.outputs.version }}
          path: |
            installer/msi/${{ steps.ver.outputs.msi_name }}
            installer/msi/${{ steps.ver.outputs.zip_name }}
            installer/msi/agent-release.json

      - name: Create or update GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $msi = "installer/msi/${{ steps.ver.outputs.msi_name }}"
          $zip = "installer/msi/${{ steps.ver.outputs.zip_name }}"
          $json = "installer/msi/agent-release.json"
          $title = "bAD agent $version"
          $notes = @"
          ## bAD agent $version

          - MSI: ``${{ steps.ver.outputs.msi_name }}``
          - Zip: ``${{ steps.ver.outputs.zip_name }}``
          - Manifest: ``agent-release.json`` (version, msi_name, sha256)

          Install (elevated):
          ``````powershell
          msiexec /i ${{ steps.ver.outputs.msi_name }} SERVERURL=https://bad.example.com /qn
          ``````

          The on-prem server mirrors these assets; agents download updates from the server, not from GitHub.
          "@
          if (gh release view $tag 2>$null) {
            gh release upload $tag $msi $zip $json --clobber
          } else {
            gh release create $tag $msi $zip $json --title $title --notes $notes
          }
