# Build Windows agent MSI with WiX and publish to a GitHub Release.
# Triggers: tag v* (e.g. v0.9.0) or manual workflow_dispatch.
#
# Required permissions: contents: write (create/update Release + upload assets).
# Secrets: GITHUB_TOKEN is sufficient for a public repo.
# Optional Authenticode (owner cert — do not invent a fake cert):
#   CODE_SIGN_PFX_BASE64, CODE_SIGN_PFX_PASSWORD, optional CODE_SIGN_TIMESTAMP_URL
#   If CODE_SIGN_PFX_BASE64 is empty, MSI ships unsigned (build still succeeds).
#
# Bootstrap notes (WiX v5 via .NET tool):
#   - Runs on windows-latest
#   - `dotnet tool install --global wix --version 5.0.2`
#   - Harvests published agent files via Product.wxs <Files Include=...>
#   - First successful tag build produces the first downloadable MSI

name: release-msi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 0.9.0). Leave empty to use tag or csproj."
        required: false
        type: string
      publish_release:
        description: "Create or update GitHub Release?"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        run: |
          $input = "${{ github.event.inputs.version }}".Trim()
          if ($input) {
            $version = $input.TrimStart('v', 'V')
          } elseif ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $version = $Matches[1]
          } else {
            [xml]$csproj = Get-Content agent/src/BadAgent/BadAgent.csproj
            $version = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if (-not $version) { $version = "0.9.0" }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Version must look like major.minor.patch, got: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "msi_name=bad-agent-$version.msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved version=$version"

      - name: Publish agent (win-x64 self-contained)
        run: |
          $out = "installer/msi/publish"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish agent/src/BadAgent/BadAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o $out
          Copy-Item installer/msi/write-config.ps1 $out -Force
          Copy-Item installer/msi/cleanup-uninstall.ps1 $out -Force
          Copy-Item installer/msi/bad-paths.ps1 $out -Force
          Copy-Item installer/msi/bad.cmd $out -Force

      - name: Install WiX toolset (dotnet tool)
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          # --global: cwd-local add caches under repo root; Build MSI runs in installer/msi (WIX0144)
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "wix extension add --global failed: $LASTEXITCODE" }
          wix extension list --global

      - name: Build MSI
        working-directory: installer/msi
        run: |
          $msi = "${{ steps.ver.outputs.msi_name }}"
          wix build Product.wxs `
            -ext WixToolset.Util.wixext `
            -arch x64 `
            -d AgentPublishDir=publish `
            -d ProductVersion=${{ steps.ver.outputs.version }} `
            -o $msi
          if (-not (Test-Path $msi)) { throw "MSI not produced: $msi" }

      - name: Sign MSI (Authenticode, optional)
        working-directory: installer/msi
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          $msi = "${{ steps.ver.outputs.msi_name }}"
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX_BASE64)) {
            Write-Host "CODE_SIGN_PFX_BASE64 not set — shipping unsigned MSI (owner cert required for Authenticode)."
            return
          }
          $pfx = Join-Path $env:RUNNER_TEMP "bad-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64.Trim()))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found under Windows Kits" }
            $ts = if ($env:CODE_SIGN_TIMESTAMP_URL) { $env:CODE_SIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
            & $signtool sign /fd SHA256 /td SHA256 /tr $ts /f $pfx /p $env:CODE_SIGN_PFX_PASSWORD $msi
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit $LASTEXITCODE" }
            & $signtool verify /pa $msi
            Write-Host "MSI signed successfully"
          }
          finally {
            if (Test-Path $pfx) { Remove-Item -Force $pfx -ErrorAction SilentlyContinue }
          }

      - name: Write agent-release.json + SHA256
        working-directory: installer/msi
        run: |
          $msi = "${{ steps.ver.outputs.msi_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $msi).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version  = "${{ steps.ver.outputs.version }}"
            msi_name = $msi
            sha256   = $hash
          }
          $manifest | ConvertTo-Json -Compress | Set-Content -Path agent-release.json -Encoding utf8
          Get-Content agent-release.json
          Write-Host "sha256=$hash"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bad-agent-msi-${{ steps.ver.outputs.version }}
          path: |
            installer/msi/${{ steps.ver.outputs.msi_name }}
            installer/msi/agent-release.json

      - name: Create or update GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $version = "${{ steps.ver.outputs.version }}"
          $msi = "installer/msi/${{ steps.ver.outputs.msi_name }}"
          $json = "installer/msi/agent-release.json"
          $title = "bAD agent $version"
          $notes = @"
          ## bAD agent $version

          - MSI: ``${{ steps.ver.outputs.msi_name }}``
          - Manifest: ``agent-release.json`` (version, msi_name, sha256)

          Install (elevated):
          ``````powershell
          msiexec /i ${{ steps.ver.outputs.msi_name }} SERVERURL=https://bad.example.com ENROLLMENTTOKEN=<token> /qn
          ``````

          The on-prem server mirrors these assets; agents download updates from the server, not from GitHub.
          "@
          if (gh release view $tag 2>$null) {
            gh release upload $tag $msi $json --clobber
          } else {
            gh release create $tag $msi $json --title $title --notes $notes
          }
