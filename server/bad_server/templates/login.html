{% extends "base.html" %}
{% block title %}Sign in — bAD{% endblock %}
{% block content %}
<section class="login">
  <h1>Operator sign-in</h1>
  <p class="muted">Enter the admin token from the server install output.</p>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label for="admin_token">Admin token</label>
    <input id="admin_token" name="admin_token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
