{# Sparse Win11-like stroke icons (inline SVG, currentColor). Not emoji. #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'host' %}
  <rect x="2.5" y="3.5" width="15" height="10" rx="1.75"/>
  <path d="M7 16.5h6M10 13.5v3"/>
{%- elif name == 'cpu' %}
  <rect x="5" y="5" width="10" height="10" rx="1.5"/>
  <rect x="7.5" y="7.5" width="5" height="5" rx="0.75"/>
  <path d="M8 2.75v2.25M12 2.75v2.25M8 15v2.25M12 15v2.25M2.75 8h2.25M2.75 12h2.25M15 8h2.25M15 12h2.25"/>
{%- elif name == 'ram' %}
  <rect x="2.5" y="6" width="15" height="8" rx="1.25"/>
  <path d="M5.5 6V4.25M8.5 6V4.25M11.5 6V4.25M14.5 6V4.25M6.5 10.25h2M11.5 10.25h2"/>
{%- elif name == 'disk' %}
  <ellipse cx="10" cy="5.5" rx="6.5" ry="2.4"/>
  <path d="M3.5 5.5v8.5c0 1.35 2.9 2.45 6.5 2.45s6.5-1.1 6.5-2.45V5.5"/>
  <path d="M3.5 10c0 1.35 2.9 2.45 6.5 2.45s6.5-1.1 6.5-2.45"/>
{%- elif name == 'gpu' %}
  <rect x="2.5" y="5" width="15" height="10" rx="1.5"/>
  <rect x="5" y="7.5" width="6" height="5" rx="0.75"/>
  <path d="M13.5 8.5h2M13.5 11.5h2"/>
{%- elif name == 'network' %}
  <circle cx="10" cy="10" r="6.5"/>
  <path d="M3.5 10h13M10 3.5c2.2 2.2 2.2 10.8 0 13M10 3.5c-2.2 2.2-2.2 10.8 0 13"/>
{%- elif name == 'users' %}
  <circle cx="10" cy="6.5" r="2.75"/>
  <path d="M4.25 16.25c.7-2.85 2.7-4.25 5.75-4.25s5.05 1.4 5.75 4.25"/>
{%- elif name == 'software' %}
  <rect x="3.5" y="3.5" width="13" height="13" rx="2"/>
  <path d="M3.5 7.5h13M7.5 3.5v4"/>
{%- elif name == 'serial' %}
  <rect x="3.5" y="5" width="13" height="10" rx="1.5"/>
  <path d="M6.5 8v4M9 8v4M11.5 8v4M14 8v4"/>
{%- elif name == 'model' %}
  <rect x="2.5" y="4.5" width="15" height="10" rx="1.75"/>
  <path d="M8 14.5h4"/>
{%- elif name == 'devices' %}
  <rect x="3" y="4" width="9" height="7" rx="1.25"/>
  <rect x="8" y="9" width="9" height="7" rx="1.25"/>
{%- elif name == 'events' %}
  <path d="M10 3.5v2M10 14.5v2M3.5 10h2M14.5 10h2"/>
  <circle cx="10" cy="10" r="3.25"/>
{%- elif name == 'policies' %}
  <path d="M10 2.75 16 5.5v4.5c0 3.4-2.5 5.9-6 6.75-3.5-.85-6-3.35-6-6.75V5.5L10 2.75z"/>
{%- elif name == 'volume' %}
  <path d="M3.5 6.5 10 3.5l6.5 3v7L10 16.5 3.5 13.5v-7z"/>
  <path d="M3.5 6.5 10 9.5l6.5-3M10 9.5v7"/>
{%- else %}
  <circle cx="10" cy="10" r="6"/>
{%- endif %}
</svg>
{%- endmacro %}

{% macro silence_label(status) -%}
{%- if status == 'ok' -%}ОК
{%- elif status == 'stale' -%}устарел
{%- else -%}{{ status }}
{%- endif -%}
{%- endmacro %}
