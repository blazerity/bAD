[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bad-server"
version = "1.10.1"
description = "blazerity Asset Discovery server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "argon2-cffi>=23.1.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "ldap3>=2.9.1",
  "cryptography>=43.0.0",
  "itsdangerous>=2.2.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bad_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
